/*
 * t2qc-plugin: build.gradle
 * Builds the T2QC data type plugin for XNAT 1.10+ (Java 21).
 */

buildscript {
    ext {
        vXnat = "1.10.1"
    }
}

plugins {
    id "java"
    id "maven-publish"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.nrg.xnat.build.xnat-data-builder" version "${vXnat}"
}

group "org.neuroinfo.t2qc"
version "1.1.0"
description "T2QC data type plugin for XNAT 1.10+"

repositories {
    mavenLocal()
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencyManagement {
    imports {
        mavenBom "org.nrg:parent:${vXnat}"
    }
    generatedPomCustomization {
        enabled = false
    }
}

dependencies {
    // Generates META-INF/xnat/*-plugin.properties from the @XnatPlugin annotation
    annotationProcessor "org.nrg:framework"
    implementation enforcedPlatform("org.nrg:parent:${vXnat}")

    implementation("org.nrg.xnat:web") {
        transitive = false
    }
    implementation("org.nrg.xdat:core") {
        transitive = false
    }
    implementation "org.nrg:framework"

    implementation("turbine:turbine") {
        transitive = false
    }
    implementation("org.apache.velocity:velocity") {
        transitive = false
    }
    implementation "org.slf4j:slf4j-api"
    // Code generated by xnat-data-builder uses the log4j 1.x API
    implementation "org.slf4j:log4j-over-slf4j"
}

sourceSets {
    main {
        java {
            srcDir "build/xnat-generated/src/main/java"
        }
        resources {
            srcDir "build/xnat-generated/src/main/resources"
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
